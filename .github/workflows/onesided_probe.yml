# Diagnostic for issue #869 (one-sided test under MS-MPI); scratch branch only.
name: One-sided probe (MS-MPI)

on:
  push:
    branches:
      - onesided_msmpi_probe
  workflow_dispatch: {}

jobs:
  # Does a spoke that is busy (no MPI calls) stall the hub's reads of its
  # window?  See .github/probe/stall_probe.py.
  stall-windows:
    name: stall probe (Windows, MS-MPI)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: examples/farmer
    steps:
      - uses: actions/checkout@v4
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: probe-env
          python-version: "3.12"
      - name: Install
        working-directory: .
        run: |
          conda install -y -c conda-forge mpi4py
          pip install -e . gurobipy
      - name: Stall probe
        timeout-minutes: 10
        run: |
          foreach ($s in "0", "2") {
            Write-Output "===== spoke sleep $s ====="
            mpiexec -timeout 300 -n 2 python -m mpi4py ../../.github/probe/stall_probe.py --num-scens 3 --solver-name gurobi --max-iterations 10 --default-rho 1 --lagrangian --spoke-sleep $s
            Write-Output "exit code $LASTEXITCODE"
          }

  stall-linux:
    name: stall probe (Linux, ${{ matrix.mpi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mpi: [openmpi, mpich]
    env:
      UCX_TLS: "self,sm,tcp"
    defaults:
      run:
        shell: bash -el {0}
        working-directory: examples/farmer
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: probe-env
          python-version: "3.12"
      - name: Install
        working-directory: .
        run: |
          conda install -y -c conda-forge mpi4py ${{ matrix.mpi }}
          pip install -e . gurobipy
          python -c "from mpi4py import MPI; print(MPI.Get_library_version())"
      - name: One-sided probe
        working-directory: .
        run: |
          timeout 60 mpiexec -n 2 python -m mpi4py mpi_one_sided_test.py; echo "exit code $?"
          for m in sleep poll; do for l in exclusive shared; do
            timeout 60 mpiexec -n 2 python -m mpi4py .github/probe/onesided_probe.py $m $l; echo "exit code $?"
          done; done
      - name: Stall probe
        timeout-minutes: 10
        run: |
          for s in 0 2; do
            echo "===== spoke sleep $s ====="
            timeout 300 mpiexec -n 2 python -m mpi4py ../../.github/probe/stall_probe.py --num-scens 3 --solver-name gurobi --max-iterations 10 --default-rho 1 --lagrangian --spoke-sleep $s
            echo "exit code $?"
          done
